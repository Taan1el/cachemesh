services:
  cachemesh:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cachemesh-app
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=production
      - PORT=4002
    volumes:
      - cachemesh-data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/api/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  cachemesh-data:
